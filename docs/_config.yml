title: Easy MIC Booster
description: Microphone gain & high-quality audio processing for Windows
remote_theme: just-the-docs/just-the-docs

url: https://seiyafunaokajp.github.io
baseurl: /Easy-MIC-Booster

aux_links:
  GitHub: https://github.com/SeiyaFunaokaJP/Easy-MIC-Booster

color_scheme: dark

nav_sort: case_insensitive

footer_content: >-
  Easy MIC Booster is dual-licensed under the <a href="https://github.com/SeiyaFunaokaJP/Easy-MIC-Booster/blob/master/LICENSE-MIT">MIT License</a> or the <a href="https://github.com/SeiyaFunaokaJP/Easy-MIC-Booster/blob/master/LICENSE-APACHE">Apache License 2.0</a>.

# Style the {: .note } / {: .warning } callouts used throughout the docs
callouts:
  note:
    color: blue
  warning:
    color: red

plugins:
  - jekyll-remote-theme

# Manual languages: English at the site root, every other language in a
# folder named after its code. The header language menu, the sidebar filter
# and the hreflang links all come from this list. A translated folder holds a
# home page (has_children) whose children are the translated pages.
languages:
  - code: en
    name: English
  - code: ja
    name: 日本語
  - code: zh-CN
    name: 简体中文
  - code: zh-TW
    name: 繁體中文
  - code: ko
    name: 한국어
  - code: de
    name: Deutsch
  - code: fr
    name: Français
  - code: es
    name: Español

defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: "ja"
    values:
      lang: ja
  - scope:
      path: "zh-CN"
    values:
      lang: zh-CN
  - scope:
      path: "zh-TW"
    values:
      lang: zh-TW
  - scope:
      path: "ko"
    values:
      lang: ko
  - scope:
      path: "de"
    values:
      lang: de
  - scope:
      path: "fr"
    values:
      lang: fr
  - scope:
      path: "es"
    values:
      lang: es

exclude:
  - Gemfile
  - Gemfile.lock
